<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comprar</title>
<link rel="stylesheet"
	th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
<link rel="stylesheet"
	th:href="@{/webjars/fontawesome/css/font-awesome.min.css}">
<link rel="stylesheet" th:href="@{/css/styles.css}">
<link rel="stylesheet" th:href="@{/css/forms.css}">
<link rel="stylesheet" th:href="@{/css/footer.css}">
</head>
<body>
	<div th:replace="layout/navbar.html :: navbar"></div>
	<div class="container my-5 p-4 bg-white shadow rounded">
		<h3 class="text-center my-3">FORMULARIO DE COMPRA</h3>
		<form action="/compra/guardar" th:object="${compra}" method="post">
			<div class="form-group row">
				<label for="codigo">Producto</label>
				<div class="col-sm-10">
					<select class="form-control" name="codigo" id="codigo" th:field="*{producto.codigo}">
						<option th:each=" producto: ${productos}" th:value="${producto.codigo}"><span
								th:text="${producto.nombre} + '-'"></span> <span
								th:text="${producto.stock} + ' disponibles'"></span>
						</option>
					</select>
				</div>
			</div>
			<div class="form-group row">
				<label for="cantidad">Cantidad</label>
				<div class="col-sm-10">
					<input type="number" class="form-control" id="codigo"
						placeholder="Codigo" th:field="*{cantidad}" th:required="true">
				</div>
			</div>
			<div class="d-flex justify-content-center mx-5 mb-4">
			<input class="btn btn-primary btn-block p-2 mx-3" type="submit"
				value="Enviar">
		</div>
	</div>
	<div th:replace="layout/footer :: footer"></div>
</body>
<script th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script th:src="@{/webjars/popper.js/umd/popper.min.js}"></script>
<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</html>
